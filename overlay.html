<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>F1 Radio 字幕</title>
  <link rel="stylesheet" href="/src/overlay.css">
</head>
<body>
  <div class="ov" id="ov">
    <div class="tb" role="toolbar" aria-label="字幕工具栏">
      <span class="grip" id="grip" title="拖动移动"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="4" r="1.1"/><circle cx="10" cy="4" r="1.1"/><circle cx="6" cy="8" r="1.1"/><circle cx="10" cy="8" r="1.1"/><circle cx="6" cy="12" r="1.1"/><circle cx="10" cy="12" r="1.1"/></svg></span>
      <span class="st"><i class="dot" id="dot"></i><span id="stText">未开始</span></span>
      <button id="play" title="开始 / 暂停（Ctrl Alt F9）" aria-label="开始"></button>
      <button id="stop" title="结束（Ctrl Alt F10）" aria-label="结束"></button>
      <span class="sep"></span>
      <button id="aDn" title="缩小字号">A−</button>
      <button id="aUp" title="放大字号">A+</button>
      <button id="plate" title="半透明底板" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="4" width="12" height="8" rx="2"/></svg></button>
      <button id="en" title="英文原文" aria-pressed="true">EN</button>
      <span class="sep"></span>
      <button id="lock" title="锁定：鼠标点击穿透到视频（Ctrl Alt L 解锁）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></button>
      <button id="settings" title="打开主窗口"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 5h7M12.5 5h1M2.5 11h1M6.5 11h7"/><circle cx="11" cy="5" r="1.5"/><circle cx="5" cy="11" r="1.5"/></svg></button>
      <button id="hide" title="隐藏字幕窗（Ctrl Alt H 或主窗口里重新显示）" aria-label="隐藏字幕窗"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
    </div>
    <div class="lines" id="lines"></div>
    <div class="toast" id="toast"></div>
    <span class="rs" id="rs" title="拖动调整大小"></span>
  </div>
  <script type="module" src="/src/overlay.js"></script>
</body>
</html>
